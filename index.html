<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        box-sizing: border-box;
        padding: 0;
        margin: 0;
        word-spacing: .1em;
        letter-spacing: 1px;
    }
    .head{
        width: 100%;
        height : 5rem;
       color: #fff7f7;
  background-color: #6e2525;
    }
    .btn {
        width : 5rem; 
        height: 1rem;
    }

    h2{ 
        color: black;
        font-weight: bold;
        font-size: 1.3rem;  


    }
    body {
        height: 100vh;
    }
    .head{
        display: flex;
    }
    .body {
        background-color: #ecbfbf;
        height: 100%;
    }
    h1{
        text-align: center;
        margin: auto;
    }
    h2{
        font-size: 2rem;
        padding: 1rem;
    }

    .btn{
        font-size: 1rem;
        display: block;
        /* border: 1px solid red; */
        width: fit-content;
        height: fit-content;
        padding: .6rem;
        margin-left: 1rem;
        border-radius: 10px;
        color: white;
        background-color: royalblue;
        text-decoration: none;
        font-size: bold;
        font-weight: bold;
        transition: color, background-color .2s ease;
    }

    .btn:hover{
        background-color: white;
        color: royalblue;
        

    }
    .img-container{
        width: 100%;
        height: 50vh;
        background-color: black;
        z-index: 100;
        
    }
    img{
        width: 100%;
        height: 50vh;
        /* display: none; */
    }
    
    footer {
        color: black;
        padding: .7rem;
        font-weight: bold;
        text-align: center;
        background-color: #484545;
        font-size: 1.3rem;
    }
    @media screen and (max-width: 570px) {
        h1{
            font-size: 1.5rem;
        }
        h2, a{
            font-size: 1.6rem;
        }

        img, .img-container{ 
            height: 30vh;
        }
    }
</style>
<body>
    <div class="head">
        <h1>Documents 3AC Collége Ibn Toumart 2026-2027 </h1>
    </div>

    <div class="body">
        <div class="img-container">
            <img src="images/photo_college_ibn_toumart.jpg" alt="" srcset="">
        </div>
        <h2>La racine carrée</h2>
        <a download="serie_2_3ac_racine_carree.pdf" href="docs/serie_2_3ac_racine_carree.pdf" class="btn">Série de la racine carrée</a>
    </div>
    <footer >
        &copy; 2026-2027 
    </footer>
</body>
</html>
